server {
    listen 80;
    server_name _;

    # Disable upstream compression so sub_filter can rewrite domain in HTML
    proxy_set_header Accept-Encoding "";

    proxy_set_header Host              bunkerz.pndz.ru;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_redirect https://bunkerz.pndz.ru/ /;
    proxy_redirect http://bunkerz.pndz.ru/  /;

    sub_filter 'bunkerz.pndz.ru' 'bunkerzmirror.duckdns.org';
    sub_filter_once off;

    location / {
        proxy_pass https://bunkerz.pndz.ru;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
